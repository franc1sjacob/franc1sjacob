# Contribution graph as a space shooter game, see https://github.com/czl9707/gh-space-shooter
name: Update space shooter

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2  # lets the action amend its previous commit instead of adding a new one each day

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'assets/space-shooter.gif'
          strategy: 'random'
          fps: 25
